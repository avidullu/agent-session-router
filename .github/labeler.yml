# actions/labeler v6 rules. Top-level keys are repository labels; each matcher
# selects files whose changes should apply that label.

source:
  - changed-files:
      - any-glob-to-any-file: "src/**/*.ts"

typescript:
  - changed-files:
      - any-glob-to-any-file: "src/**/*.ts"

agent-support:
  - changed-files:
      - any-glob-to-any-file:
          - "src/discoverers/**"
          - "src/extractors/**"

discoverer:
  - changed-files:
      - any-glob-to-any-file: "src/discoverers/**"

extractor:
  - changed-files:
      - any-glob-to-any-file: "src/extractors/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "test/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

automation:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "SETUP.md"
          - "PLAN.md"

planning:
  - changed-files:
      - any-glob-to-any-file: "PLAN.md"

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "tsconfig.json"
          - ".eslintrc.json"
          - ".prettierrc"

dependencies:
  - changed-files:
      - any-glob-to-any-file: "package-lock.json"

linting:
  - changed-files:
      - any-glob-to-any-file: ".eslintrc.json"

formatting:
  - changed-files:
      - any-glob-to-any-file: ".prettierrc"

renderer:
  - changed-files:
      - any-glob-to-any-file: "src/renderers/**"
