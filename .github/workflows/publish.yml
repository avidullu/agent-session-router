name: Publish

# Publish to VS Code Marketplace + Open VSX on tag push (v*).
# Requires secrets: VSCE_PAT (Azure DevOps PAT) and OVSX_PAT (Open VSX token).
#
# Setup (one-time per publisher):
#   1. Create Azure DevOps org → generate PAT with "Marketplace (Publish)" scope
#   2. Create Open VSX account → generate access token at https://open-vsx.org/user-settings/tokens
#   3. Add both as repo secrets: VSCE_PAT and OVSX_PAT
#   4. Create a publisher at https://marketplace.visualstudio.com/manage (if not already)
#
# Then push a tag: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Publish to VS Code Marketplace
        if: success()
        run: npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: success()
        run: npx ovsx publish --pat ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
