name: Publish

# Publish to VS Code Marketplace (+ Open VSX if configured) on tag push (v*).
# Requires secret: VSCE_PAT (Azure DevOps PAT with Marketplace → Manage scope).
# Optional secret: OVSX_PAT (Open VSX token).
#
# Then push a tag: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Map secrets to env at the job level: the `secrets` context is NOT
    # available in step `if:` conditions (only `env` is), so referencing
    # secrets there fails the whole workflow at startup with zero jobs.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Publish to VS Code Marketplace
        if: success()
        run: npx @vscode/vsce publish

      - name: Publish to Open VSX
        # Optional channel: skip cleanly when no Open VSX token is configured,
        # so a release is not marked failed after the Marketplace publish
        # already succeeded (D4 lists Open VSX as tentative).
        if: ${{ success() && env.OVSX_PAT != '' }}
        run: npx ovsx publish
