name: Publish

# Publish to VS Code Marketplace (+ Open VSX if configured) on tag push (v*).
# Requires secret: VSCE_PAT (Azure DevOps PAT with Marketplace → Manage scope).
# Optional secret: OVSX_PAT (Open VSX token).
#
# After owner merge and approval, push the matching version tag to GitHub.
# Keep the same tag in Forgejo; only GitHub performs external publication.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    name: Publish to Marketplaces
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-heavy' }}
    timeout-minutes: 10
    # Map secrets to env at the job level: the `secrets` context is NOT
    # available in step `if:` conditions (only `env` is), so referencing
    # secrets there fails the whole workflow at startup with zero jobs.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 22.5+ exercises the Copilot session-store.db integration test
          # instead of taking its compatibility skip path.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release tag matches package version
        run: node scripts/check-release-tag.js

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm run ci:check

      - name: Publish to VS Code Marketplace
        if: success()
        run: npx @vscode/vsce publish

      - name: Publish to Open VSX
        # Optional channel: skip cleanly when no Open VSX token is configured,
        # so a release is not marked failed after the Marketplace publish
        # already succeeded (D4 lists Open VSX as tentative).
        if: ${{ success() && env.OVSX_PAT != '' }}
        run: npx ovsx publish
